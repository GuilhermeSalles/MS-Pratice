spring.application.name=estoque-service
server.port=8080

# Broker: localhost quando roda pela IDE; o docker-compose injeta
# SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092 e sobrescreve este valor.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Topico compartilhado entre os dois servicos
app.kafka.topic.vendas=vendas

# --- Consumer (estoque consome os eventos de venda) ---
spring.kafka.consumer.group-id=estoque-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# --- Producer (para eventuais eventos de retorno ao venda-service) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
