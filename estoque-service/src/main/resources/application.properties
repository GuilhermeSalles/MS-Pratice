spring.application.name=estoque-service
server.port=8080

# localhost quando roda pela IDE; o docker-compose injeta
# SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092 e sobrescreve
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Grupo de consumo do estoque
spring.kafka.consumer.group-id=estoque-group

# Topico compartilhado entre os dois servicos
app.kafka.topic=estoque-topic
