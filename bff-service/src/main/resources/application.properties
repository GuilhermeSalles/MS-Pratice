spring.application.name=bff-service
server.port=8082

# localhost quando roda pela IDE; o docker-compose injeta
# SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092 e sobrescreve
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Topico e grupo que o painel observa (so leitura, via AdminClient)
app.kafka.topic=estoque-topic
app.kafka.group=estoque-group

# Os microsservicos que o BFF orquestra
app.venda-service.url=${VENDA_SERVICE_URL:http://localhost:8081}
app.estoque-service.url=${ESTOQUE_SERVICE_URL:http://localhost:8080}
